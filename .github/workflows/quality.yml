
name: Add Peggle WASM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download peggle.wasm
        run: |
          mkdir -p offline
          curl -fL \
            "https://github.com/Camerons-Git7/Offline-HTML-Games-Pack/releases/download/Large-Assets/peggle.wasm" \
            -o offline/peggle.wasm

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add offline/peggle.wasm

          if ! git diff --cached --quiet; then
            git commit -m "Add Peggle WASM asset"
            git push origin master
          else
            echo "peggle.wasm is already up to date."
          fi
