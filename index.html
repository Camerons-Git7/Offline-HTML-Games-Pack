<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline HTML Games Pack</title>
<style>
  :root {
    --card-bg: rgba(255, 255, 255, 0.07);
    --card-bg-hover: rgba(255, 255, 255, 0.14);
    --card-border: rgba(255, 255, 255, 0.12);
    --text-main: #f5f3ff;
    --text-dim: rgba(245, 243, 255, 0.65);
    --accent: #ffd166;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
  }

  body {
    background: linear-gradient(-45deg, #1b0f3a, #3a1c71, #6a2c91, #d76d77, #2b3a91);
    background-size: 400% 400%;
    animation: gradientShift 22s ease infinite;
    position: relative;
    overflow-x: hidden;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* soft floating glow blobs for extra depth */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    width: 45vw;
    height: 45vw;
    background: #ff8fb1;
    top: -10%;
    left: -10%;
    animation: floatA 18s ease-in-out infinite alternate;
  }

  body::after {
    width: 40vw;
    height: 40vw;
    background: #6ee7ff;
    bottom: -15%;
    right: -10%;
    animation: floatB 20s ease-in-out infinite alternate;
  }

  @keyframes floatA {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vw, 8vh) scale(1.15); }
  }

  @keyframes floatB {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-8vw, -6vh) scale(1.1); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0 0 10px;
    letter-spacing: -0.02em;
    text-shadow: 0 4px 24px rgba(0,0,0,0.35);
  }

  header p {
    margin: 0 auto;
    max-width: 620px;
    color: var(--text-dim);
    font-size: 1.05rem;
    line-height: 1.5;
  }

  .meta-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .badge {
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--card-border);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    color: var(--text-dim);
    backdrop-filter: blur(6px);
  }

  .search-box {
    max-width: 480px;
    margin: 32px auto 8px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 14px 20px 14px 44px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: rgba(0, 0, 0, 0.25);
    color: var(--text-main);
    font-size: 1rem;
    outline: none;
    backdrop-filter: blur(10px);
    transition: border-color 0.2s, background 0.2s;
  }

  .search-box input::placeholder {
    color: var(--text-dim);
  }

  .search-box input:focus {
    border-color: var(--accent);
    background: rgba(0, 0, 0, 0.4);
  }

  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    opacity: 0.6;
  }

  #count {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
    margin: 10px 0 28px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }

  .card {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 84px;
    padding: 14px 12px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.3;
    backdrop-filter: blur(8px);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    background: var(--card-bg-hover);
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.3);
  }

  .card:active {
    transform: translateY(-1px) scale(0.98);
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    display: none;
  }

  footer {
    text-align: center;
    margin-top: 60px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎮 Offline HTML Games Pack</h1>
      <p>300 games, each a single self-contained HTML file. No internet, no installs &mdash; just click and play.</p>
      <div class="meta-row">
        <span class="badge" id="totalBadge">300 games</span>
        <span class="badge">Works fully offline</span>
        <span class="badge">Single-file HTML</span>
      </div>
    </header>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search" placeholder="Search games…" autocomplete="off" autofocus>
    </div>
    <div id="count"></div>

    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState">No games match your search.</div>

    <footer>
      Part of the <a href="https://github.com/GeorgeXL26/Offline-HTML-Games-Pack" target="_blank" rel="noopener">Offline-HTML-Games-Pack</a> repository.
    </footer>
  </div>

"pou.html", "ragdollarchers.htm", "ragdollhit.html", "ragdollsoccer.html", "redball4vol1.html", "redball4vol2.html", "redball4vol3.html", "retrobowl.html", "retrobowlcollege.html", "retrohighway.html", "retropingpong.html", "riddleschool.html", "riddleschool2.html", "riddleschool3.html", "riddleschool4.html", "riddleschool5.html", "riddletransfer.html", "riddletransfer2.html", "rocketsoccerderby.html", "rooftopsnipers.htm", "rooftopsnipers2.html", "run.html", "run2.html", "run3.html", "sandgame.html", "shortlife.html", "slope.html", "slope2player.html", "slope3.html", "slowroads.html", "sm63.html", "sm64.html", "snowballio.html", "snowrider.htm", "snowroad.htm", "soccerbros.html", "soccerrandom.htm", "spacebarclicker.html", "spaceiskey.html", "spaceiskey2.html", "spacewaves.html", "speedstars.html", "sprunki.html", "stack.html", "stacktris.html", "stateio.html", "stickarchersbattle.html", "stickfighter.html", "stickmanhook.html", "stickmerge.html", "subwaysurfersbeijing.html", "subwaysurfershavana.html", "subwaysurferssanfrancisco.html", "superbikethechampion.html", "superhot.html", "superliquidsoccer.html", "superstarcar.html", "tabletennisworldtour.html", "tag.html", "taproad.html", "templeofboom.html", "templerun2.htm", "territorialio.html", "theimpossiblequiz.html", "theimpossiblequiz2.html", "thereisnog.html", "theyarecoming.html", "thisistheonlylevel.html", "thisistheonlyleveltoo.html", "timeshooter2.html", "timeshooter3.htm", "tinyfishing.html", "tombofthemask.htm", "trapthecat.html", "triviacrack.html", "tubejumpers.html", "tunnelrush.html", "unicyclehero.html", "vex4.html", "vex5.html", "vex6.htm", "vex7.htm", "vex8.htm", "vexx3m.html", "vexx3m2.html", "volleyrandom.html", "wartheknights.html", "webecomewhatwebehold.html", "wheeliebike.html", "wheely.html", "wheely2.html", "wheely3.html", "wheely4.html", "wheely5.html", "wheely6.html", "wheely7.html", "wheely8.html", "wordleunlimited.html", "worldshardestgame.html", "worldshardestgame2.html", "worldshardestgame3.html", "wrestlebros.html", "zombierush.html"];

  function prettify(filename) {
    let name = filename.replace(/\.(html?|htm)$/i, "");
    name = name.replace(/[_\-]+/g, " ");
    // split camelCase / lowerUpper boundaries, and letter-number boundaries
    name = name.replace(/([a-z])([A-Z])/g, "$1 $2");
    name = name.replace(/([a-zA-Z])(\d)/g, "$1 $2");
    name = name.replace(/(\d)([a-zA-Z])/g, "$1 $2");
    name = name.replace(/\s+/g, " ").trim();
    return name
      .split(" ")
      .map(w => w.length ? w.charAt(0).toUpperCase() + w.slice(1) : w)
      .join(" ");
  }

  const games = files
    .map(f => ({ file: f, title: prettify(f) }))
    .sort((a, b) => a.title.localeCompare(b.title));

  const grid = document.getElementById("grid");
  const search = document.getElementById("search");
  const countEl = document.getElementById("count");
  const emptyState = document.getElementById("emptyState");
  const totalBadge = document.getElementById("totalBadge");

  totalBadge.textContent = games.length + " games";

  function render(list) {
    grid.innerHTML = "";
    const frag = document.createDocumentFragment();
    for (const g of list) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = "offline/" + g.file;
      a.textContent = g.title;
      frag.appendChild(a);
    }
    grid.appendChild(frag);
    countEl.textContent = list.length === games.length
      ? `Showing all ${games.length} games`
      : `Showing ${list.length} of ${games.length} games`;
    emptyState.style.display = list.length === 0 ? "block" : "none";
    grid.style.display = list.length === 0 ? "none" : "grid";
  }

  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    const filtered = q
      ? games.filter(g => g.title.toLowerCase().includes(q) || g.file.toLowerCase().includes(q))
      : games;
    render(filtered);
  });

  render(games);
</script>
